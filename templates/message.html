<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Messages</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const toasts = document.querySelectorAll('.toast-item')
      
        toasts.forEach((toast, index) => {
          // Staggered entry animation using the 'show' class
          setTimeout(() => {
            toast.classList.add('show')
          }, index * 150)
      
          // Auto-dismiss after 5 seconds
          setTimeout(() => {
            toast.classList.remove('show')
      
            // Wait for slide-out animation to finish before removal
            toast.addEventListener('transitionend', () => {
              toast.remove()
            })
          }, 5000)
        })
      })
    </script>
    <style>
      #toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        width: 100%;
        pointer-events: none; /* Allows clicking elements behind container gaps */
      }
      
      .toast-item {
        display: flex;
        align-items: center;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        min-width: 300px;
        font-family: system-ui, sans-serif;
        pointer-events: auto; /* Restores clicking on the toast itself */
        
        /* Initial Hidden State (Slid out right and transparent) */
        transform: translateX(50px);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Visible State triggered by JavaScript */
      .toast-item.show {
        transform: translateX(0);
        opacity: 1;
      }
      
      /* Status variants */
      .toast-item.success {
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #065f46;
      }
      .toast-item.danger, .toast-item.error {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #9f1239;
      }
      .toast-item.warning {
        background: #fffbeb;
        border: 1px solid #fef3c7;
        color: #92400e;
      }
      .toast-item.info {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1e40af;
      }

      /* Structure layouts inside toast */
      .toast-icon {
        margin-right: 12px;
        font-size: 1.15rem;
        font-weight: bold;
      }
      .toast-body {
        flex: 1;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .toast-close {
        background: none;
        border: none;
        margin-left: 16px;
        color: inherit;
        opacity: 0.4;
        cursor: pointer;
        font-size: 1.25rem;
        padding: 4px;
        transition: opacity 0.2s;
      }
      .toast-close:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>

    {% if messages %}
      <!-- Container -->
      <div id="toast-container">
        {% for message in messages %}
          <!-- Evaluates the class to success, danger, warning, or info dynamically -->
          <div class="toast-item {% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
            
            <!-- Left Side Icon Indicator -->
            <div class="toast-icon">
              {% if message.tags == 'success' %}
                ✨
              {% elif message.tags == 'danger' or message.tags == 'error' %}
                ⚠️
              {% elif message.tags == 'warning' %}
                ⏳
              {% else %}
                ℹ️
              {% endif %}
            </div>

            <!-- Message Body -->
            <div class="toast-body">{{ message }}</div>

            <!-- Interactive Dismiss Button -->
            <button onclick="this.parentElement.remove()" class="toast-close">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

  </body>
</html>
